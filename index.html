<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download MubiTV - Stream Movies & TV</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;900&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet"/>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: "#E21221", background: "#131313", surface: "#1c1b1b" },
                    fontFamily: { headline: ["Epilogue", "sans-serif"], body: ["Manrope", "sans-serif"] }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-white font-body min-h-screen flex flex-col selection:bg-primary selection:text-white">

    <!-- Navigation -->
    <nav class="w-full px-6 py-4 flex items-center justify-between border-b border-white/10 bg-background/90 backdrop-blur-md fixed top-0 z-50">
        <div class="flex items-center gap-3">
            <!-- Replace with your actual logo URL if hosted externally -->
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center shadow-lg shadow-primary/30">
                <span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            </div>
            <span class="font-headline font-black text-xl tracking-wide">MubiTV</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 pt-32 pb-20 text-center relative overflow-hidden">
        <!-- Background Glow -->
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>

        <!-- App Icon -->
        <div class="w-32 h-32 md:w-40 md:h-40 bg-surface border border-white/10 rounded-3xl shadow-2xl flex items-center justify-center mb-8 relative z-10">
            <span class="material-symbols-outlined text-primary text-6xl md:text-7xl" style="font-variation-settings: 'FILL' 1;">movie</span>
        </div>

        <h1 class="text-4xl md:text-6xl font-black font-headline tracking-tighter mb-4 z-10">
            Watch your favorite <br/>
            <span class="text-primary">movies & tv shows</span>
        </h1>
        
        <p class="text-white/60 font-medium max-w-md mx-auto mb-10 z-10 text-sm md:text-base leading-relaxed">
            The ultimate streaming experience. Download the latest version of MubiTV to access thousands of titles in HD and 4K directly on your Android device.
        </p>

        <!-- Download Action Area -->
        <div class="flex flex-col items-center gap-4 z-10 w-full max-w-xs">
            <button id="install-btn" onclick="fetchAndDownloadApp()" class="w-full bg-primary hover:bg-[#c00016] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-sm transform active:scale-95 transition-all shadow-lg shadow-primary/30 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-xl">download</span>
                Install Now
            </button>
            
            <div class="flex items-center gap-4 text-xs font-bold text-white/50 uppercase tracking-widest">
                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">android</span> Android Only</span>
                <span class="w-1 h-1 rounded-full bg-white/30"></span>
                <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">sd_storage</span> Size: 24 MB</span>
            </div>
        </div>
        
        <!-- Error/Status Message -->
        <p id="status-msg" class="text-primary text-sm font-bold mt-4 hidden z-10 tracking-wide"></p>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 border-t border-white/10 text-center z-10 bg-background">
        <p class="text-white/40 text-xs font-medium">&copy; 2024 MubiTV. All rights reserved.</p>
    </footer>

    <!-- GitHub Download Logic -->
    <script>
        async function fetchAndDownloadApp() {
            const btn = document.getElementById('install-btn');
            const statusMsg = document.getElementById('status-msg');
            const originalContent = btn.innerHTML;
            
            // Loading State
            btn.innerHTML = `<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Fetching...`;
            btn.disabled = true;
            statusMsg.classList.add('hidden');

            try {
                // Use the raw GitHub URL to bypass HTML rendering
                const response = await fetch('https://raw.githubusercontent.com/binzhilling-star/update-pro.json/main/update-pro.json', { cache: "no-store" });
                
                if (!response.ok) throw new Error("Failed to reach GitHub server.");
                
                const data = await response.json();
                
                // Adjust this key based on your actual JSON structure (e.g., data.apkUrl, data.url, data.link)
                const downloadLink = data.apkUrl || data.url || data.downloadUrl || data.link;

                if (downloadLink) {
                    window.location.href = downloadLink; // Triggers the download
                } else {
                    throw new Error("Download link not found in configuration.");
                }
            } catch (error) {
                console.error("Download Error:", error);
                statusMsg.innerText = error.message === "Failed to fetch" 
                    ? "Network error. Please try again." 
                    : error.message;
                statusMsg.classList.remove('hidden');
            } finally {
                // Reset Button
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }, 2000);
            }
        }
    </script>
</body>
</html>
